[project]
name = "arguide-backend"
version = "0.1.0"
description = "ArGuide API and live-call relay"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-socketio>=5.11",
  "sqlalchemy>=2.0.36",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "aiohttp>=3.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
